---
- name: Install Java runtime
  ansible.builtin.package:
    name: "{{ tomcat_java_package[ansible_facts['os_family']] }}"
    state: present
  register: tomcat_java_install
  retries: 3
  delay: 5
  until: tomcat_java_install is succeeded

- name: Install tar (needed to unpack the release)
  ansible.builtin.package:
    name: tar
    state: present

- name: Create Tomcat group
  ansible.builtin.group:
    name: "{{ tomcat_group }}"
    system: true

- name: Create Tomcat user
  ansible.builtin.user:
    name: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ tomcat_install_root }}"
    create_home: false

- name: Create install root
  ansible.builtin.file:
    path: "{{ tomcat_install_root }}"
    state: directory
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0755"

- name: Download Tomcat, checksum-verified | {{ tomcat_version }}
  ansible.builtin.get_url:
    url: "{{ tomcat_release_url }}"
    dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    checksum: "sha512:{{ tomcat_release_url }}.sha512"
    mode: "0644"
  register: tomcat_download
  retries: 3
  delay: 5
  until: tomcat_download is succeeded

- name: Unpack Tomcat
  ansible.builtin.unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "{{ tomcat_install_root }}"
    remote_src: true
    owner: root
    group: "{{ tomcat_group }}"
    creates: "{{ tomcat_install_root }}/apache-tomcat-{{ tomcat_version }}/bin/catalina.sh"

- name: Point current at this release
  ansible.builtin.file:
    src: "{{ tomcat_install_root }}/apache-tomcat-{{ tomcat_version }}"
    dest: "{{ tomcat_home }}"
    state: link
  notify: Restart tomcat

- name: Give Tomcat write access only to runtime directories
  ansible.builtin.file:
    path: "{{ tomcat_home }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "u=rwX,g=rX,o="
    recurse: true
  loop: [logs, temp, work, webapps]

# Symbolic modes (X) keep this idempotent alongside the 0640 templates below.
- name: Make configuration readable by Tomcat, writable by root only
  ansible.builtin.file:
    path: "{{ tomcat_home }}/conf"
    state: directory
    owner: root
    group: "{{ tomcat_group }}"
    mode: "u=rwX,g=rX,o="
    recurse: true

- name: Remove default applications
  ansible.builtin.file:
    path: "{{ tomcat_home }}/webapps/{{ item }}"
    state: absent
  loop: [ROOT, docs, examples, manager, host-manager]
  when: tomcat_remove_default_apps

- name: Create health-check app directory
  ansible.builtin.file:
    path: "{{ tomcat_home }}/webapps/health"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0750"

- name: Deploy health-check page
  ansible.builtin.copy:
    dest: "{{ tomcat_home }}/webapps/health/index.html"
    content: "OK\n"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0640"

- name: Configure server.xml
  ansible.builtin.template:
    src: server.xml.j2
    dest: "{{ tomcat_home }}/conf/server.xml"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0640"
  notify: Restart tomcat

- name: Configure JVM options
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ tomcat_home }}/bin/setenv.sh"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0750"
  notify: Restart tomcat

- name: Install systemd unit
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    owner: root
    group: root
    mode: "0644"
  when: tomcat_manage_service
  notify: Restart tomcat

- name: Enable and start Tomcat
  ansible.builtin.systemd_service:
    name: tomcat
    enabled: true
    state: started
    daemon_reload: true
  when: tomcat_manage_service

- name: Apply pending restarts before checking health
  ansible.builtin.meta: flush_handlers

- name: Wait for Tomcat to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tomcat_http_port }}/health/"
    status_code: 200
  register: tomcat_health
  retries: 12
  delay: 5
  until: tomcat_health.status == 200
  when: tomcat_manage_service
