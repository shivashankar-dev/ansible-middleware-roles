---
# Tomcat release to install. The tarball is verified against Apache's published SHA-512.
tomcat_version: "10.1.34"
tomcat_mirror: "https://archive.apache.org/dist/tomcat"

tomcat_install_root: /opt/tomcat
tomcat_home: "{{ tomcat_install_root }}/current"
tomcat_user: tomcat
tomcat_group: tomcat

tomcat_java_package:
  Debian: openjdk-17-jre-headless
  RedHat: java-17-openjdk-headless

tomcat_http_port: 8080
tomcat_shutdown_port: -1 # disables the shutdown port; stop through systemd only
tomcat_jvm_heap_min: 256m
tomcat_jvm_heap_max: 512m
tomcat_extra_java_opts: ""

# Remove the default ROOT, docs and examples apps (hardening).
tomcat_remove_default_apps: true

# Manage a systemd unit. Set false in containers without systemd.
tomcat_manage_service: true
