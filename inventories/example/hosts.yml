---
all:
  children:
    tomcat_servers:
      hosts:
        app-01:
          ansible_host: 10.10.0.11
      vars:
        ansible_user: deploy
        tomcat_http_port: 8080
        tomcat_jvm_heap_max: 1g

    iis_servers:
      hosts:
        web-01:
          ansible_host: 10.10.0.21
      vars:
        # WinRM over HTTPS. On GCP, reach private VMs through IAP or a bastion.
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_user: ansible
        # ansible_password comes from Ansible Vault or a secret manager, never this file.
